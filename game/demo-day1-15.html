<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindLink - Day 1-15 Demo</title>
    <style>
/* 使用之前的CSS... */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --primary-bg: #0a0e27;
    --secondary-bg: #151932;
    --accent-blue: #00d4ff;
    --accent-purple: #9d4edd;
    --accent-pink: #ff006e;
    --text-primary: #e0e0e0;
    --text-secondary: #a0a0a0;
    --border-color: #2d3561;
    --success-color: #06ffa5;
    --warning-color: #ffbe0b;
    --danger-color: #ff006e;
    --pixel-font: 'Courier New', monospace;
}

body {
    font-family: var(--pixel-font);
    background: linear-gradient(135deg, var(--primary-bg) 0%, var(--secondary-bg) 100%);
    color: var(--text-primary);
    min-height: 100vh;
}

#game-container {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    min-height: 100vh;
    background-color: var(--primary-bg);
    box-shadow: 0 0 50px rgba(0, 212, 255, 0.3);
    padding: 20px;
}

/* 对话框 UI */
.dialogue-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(10, 14, 39, 0.9);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.dialogue-overlay.active {
    display: flex;
}

.dialogue-box {
    width: 90%;
    max-width: 800px;
    background: var(--secondary-bg);
    border: 3px solid var(--accent-blue);
    padding: 30px;
    box-shadow: 0 0 50px rgba(0, 212, 255, 0.5);
}

.dialogue-location {
    color: var(--accent-purple);
    font-size: 0.9rem;
    margin-bottom: 10px;
    text-align: center;
}

.dialogue-speaker {
    color: var(--accent-blue);
    font-size: 1.3rem;
    margin-bottom: 15px;
    font-weight: bold;
}

.dialogue-text {
    color: var(--text-primary);
    font-size: 1.1rem;
    line-height: 1.8;
    margin-bottom: 20px;
    min-height: 100px;
    white-space: pre-wrap;
}

.dialogue-choices {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.choice-btn {
    background: var(--primary-bg);
    border: 2px solid var(--accent-blue);
    color: var(--text-primary);
    padding: 15px;
    font-family: var(--pixel-font);
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    text-align: left;
}

.choice-btn:hover {
    background: var(--accent-blue);
    color: var(--primary-bg);
    transform: translateX(10px);
}

.dialogue-continue {
    background: var(--accent-blue);
    border: none;
    color: var(--primary-bg);
    padding: 12px 30px;
    font-family: var(--pixel-font);
    font-size: 1rem;
    cursor: pointer;
    float: right;
    transition: all 0.3s;
}

.dialogue-continue:hover {
    transform: scale(1.05);
}

/* 游戏UI */
.game-header {
    background: var(--secondary-bg);
    border: 2px solid var(--border-color);
    padding: 20px;
    margin-bottom: 20px;
}

.day-display {
    font-size: 2rem;
    color: var(--accent-blue);
    text-align: center;
    margin-bottom: 10px;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 10px;
    margin-top: 15px;
}

.stat-item {
    background: var(--primary-bg);
    border: 1px solid var(--border-color);
    padding: 10px;
    text-align: center;
}

.stat-label {
    color: var(--text-secondary);
    font-size: 0.9rem;
}

.stat-value {
    color: var(--accent-blue);
    font-size: 1.5rem;
    font-weight: bold;
}

/* 按钮 */
.btn {
    background: var(--secondary-bg);
    border: 2px solid var(--accent-blue);
    color: var(--accent-blue);
    padding: 15px 30px;
    font-family: var(--pixel-font);
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.3s;
    margin: 10px;
}

.btn:hover {
    background: var(--accent-blue);
    color: var(--primary-bg);
    transform: translateY(-2px);
}

.btn-primary {
    background: var(--accent-blue);
    color: var(--primary-bg);
}

.action-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 15px;
    margin-top: 20px;
}

.action-card {
    background: var(--secondary-bg);
    border: 2px solid var(--border-color);
    padding: 20px;
    cursor: pointer;
    transition: all 0.3s;
}

.action-card:hover {
    border-color: var(--accent-blue);
    transform: translateY(-5px);
    box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
}

.action-title {
    color: var(--accent-blue);
    font-size: 1.2rem;
    margin-bottom: 10px;
}

.action-desc {
    color: var(--text-secondary);
    font-size: 0.9rem;
    margin-bottom: 10px;
}

.log {
    background: var(--secondary-bg);
    border: 2px solid var(--border-color);
    padding: 20px;
    margin-top: 20px;
    max-height: 300px;
    overflow-y: auto;
}

.log-entry {
    color: var(--text-secondary);
    margin-bottom: 10px;
    padding: 5px;
    border-left: 2px solid var(--accent-purple);
    padding-left: 10px;
}

.log-entry.important {
    color: var(--accent-blue);
    border-left-color: var(--accent-blue);
}

.notification {
    position: fixed;
    top: 20px;
    right: 20px;
    background: var(--accent-blue);
    color: var(--primary-bg);
    padding: 15px 25px;
    border-radius: 5px;
    font-size: 1rem;
    opacity: 0;
    transition: opacity 0.3s;
    z-index: 2000;
    pointer-events: none;
}

.notification.show {
    opacity: 1;
}
    </style>
</head>

// MindLink Day 1-15 Demo

                    { speaker: '你', text: '（专注...就像那个声音说的...）' },
                    { speaker: 'System', text: '世界开始扭曲。你的意识被拉入了另一个维度。' },
                    { speaker: '神秘声音', text: '很好。这就是认知空间的入口。' },

        activities: [

    // 游戏状态
    class Game {
        constructor() {
            this.day = 1;
            this.period = 0; // 0=早晨, 1=下午, 2=夜晚
            this.stats = {
                knowledge: 1,
                courage: 1,
                charm: 1,
                combat: 1,
                money: 500
            };
            this.flags = new Set();
            this.relationships = { akatsuki: 0, zero: 0, mizuki: 0 };
            this.currentDialogue = null;
            this.dialogueIndex = 0;
            this.branch = null;
        }

        startGame() {
            this.log('游戏开始！', true);
            this.checkDialogueTrigger();
            this.updateUI();
        }

        skipToDay(targetDay) {
            this.day = targetDay;
            this.period = 0;
            this.stats.combat = Math.floor(targetDay / 3);
            this.stats.knowledge = Math.floor(targetDay / 3);
            this.updateUI();
            this.log(`跳到 Day ${targetDay}`, true);
            this.checkDialogueTrigger();
        }

        checkDialogueTrigger() {
            for (const [id, dialogue] of Object.entries(GameData.dialogues)) {
                if (dialogue.day === this.day && dialogue.period === this.period) {
                    // 检查flags
                    let canTrigger = true;
                    if (dialogue.require && dialogue.require.flags) {
                        for (const flag of dialogue.require.flags) {
                            if (!this.flags.has(flag)) {
                                canTrigger = false;
                                break;
                            }
                        }
                    }

                    if (canTrigger) {
                        this.startDialogue(dialogue);
                        return;
                    }
                }
            }
        }

        startDialogue(dialogue) {
            this.currentDialogue = dialogue;
            this.dialogueIndex = 0;
            this.branch = null;
            this.showDialogue();
        }

        showDialogue() {
            if (!this.currentDialogue) return;

            const overlay = document.getElementById('dialogue-overlay');
            overlay.classList.add('active');

            const location = document.getElementById('dialogue-location');
            location.textContent = this.currentDialogue.location;

            this.showLine();
        }

        showLine() {
            let lines = this.branch ?
                (this.currentDialogue.branches[this.branch] || []) :
                this.currentDialogue.lines;

            if (this.dialogueIndex >= lines.length) {
                this.endDialogue();
                return;
            }

            const line = lines[this.dialogueIndex];
            const speaker = document.getElementById('dialogue-speaker');
            const text = document.getElementById('dialogue-text');
            const choices = document.getElementById('dialogue-choices');
            const continueBtn = document.getElementById('dialogue-continue');

            speaker.textContent = line.speaker || '';
            text.textContent = line.text || '';

            choices.innerHTML = '';
            if (line.choices) {
                continueBtn.style.display = 'none';
                line.choices.forEach((choice, index) => {
                    const btn = document.createElement('button');
                    btn.className = 'choice-btn';
                    btn.textContent = choice.text;
                    btn.onclick = () => this.makeChoice(choice);
                    choices.appendChild(btn);
                });
            } else {
                continueBtn.style.display = 'block';
            }
        }

        makeChoice(choice) {
            if (choice.relationship) {
                // 增加好感度
                this.log(`${choice.text} (好感度 +${choice.relationship})`, true);
            }

            if (choice.value) {
                this.branch = choice.value;
                this.dialogueIndex = 0;
            } else {
                this.dialogueIndex++;
            }

            this.showLine();
        }

        continueDialogue() {
            this.dialogueIndex++;
            this.showLine();
        }

        endDialogue() {
            const overlay = document.getElementById('dialogue-overlay');
            overlay.classList.remove('active');

            // 应用奖励
            if (this.currentDialogue.rewards) {
                const rewards = this.currentDialogue.rewards;

                if (rewards.flags) {
                    rewards.flags.forEach(flag => {
                        this.flags.add(flag);
                        this.log(`解锁: ${flag}`, true);
                    });
                }

                if (rewards.combat) {
                    this.stats.combat += rewards.combat;
                    this.log(`战斗力 +${rewards.combat}`, true);
                }

                if (rewards.relationship) {
                    for (const [char, value] of Object.entries(rewards.relationship)) {
                        this.relationships[char] = (this.relationships[char] || 0) + value;
                        this.log(`${char} 好感度 +${value}`, true);
                    }
                }

                if (rewards.items) {
                    rewards.items.forEach(item => {
                        this.log(`获得道具: ${item}`, true);
                    });
                }

                if (rewards.money) {
                    this.stats.money += rewards.money;
                    this.log(`获得金钱: ${rewards.money}`, true);
                }
            }

            this.currentDialogue = null;
            this.updateUI();
            this.renderActions();
        }

        doActivity(activity) {
            this.log(`执行活动: ${activity.name}`);

            if (activity.effect) {
                for (const [stat, value] of Object.entries(activity.effect)) {
                    if (stat === 'money') {
                        this.stats.money += value;
                        this.log(`金钱 ${value > 0 ? '+' : ''}${value}`);
                    } else if (stat === 'relationship') {
                        for (const [char, rel] of Object.entries(value)) {
                            this.relationships[char] = (this.relationships[char] || 0) + rel;
                            this.log(`${char} 好感度 +${rel}`);
                        }
                    } else if (this.stats[stat] !== undefined) {
                        this.stats[stat] += value;
                        this.log(`${stat} +${value}`);
                    }
                }
            }

            this.advanceTime();
        }

        advanceTime() {
            this.period++;
            if (this.period >= 3) {
                this.period = 0;
                this.day++;
                this.log(`===== Day ${this.day} =====`, true);
            }

            this.updateUI();
            this.renderActions();
            this.checkDialogueTrigger();
        }

        renderActions() {
            const list = document.getElementById('action-list');
            list.innerHTML = '';

            const periodNames = ['早晨', '下午', '夜晚'];
            document.getElementById('time-period').textContent = periodNames[this.period];

            GameData.activities.forEach(activity => {
                if (activity.period.includes(this.period)) {
                    // 检查要求
                    if (activity.require && activity.require.flags) {
                        let canDo = true;
                        for (const flag of activity.require.flags) {
                            if (!this.flags.has(flag)) {
                                canDo = false;
                                break;
                            }
                        }
                        if (!canDo) return;
                    }

                    const card = document.createElement('div');
                    card.className = 'action-card';
                    card.innerHTML = `
                        <div class="action-title">${activity.name}</div>
                        <div class="action-desc">${activity.desc}</div>
                    `;
                    card.onclick = () => this.doActivity(activity);
                    list.appendChild(card);
                }
            });
        }

        updateUI() {
            document.getElementById('current-day').textContent = this.day;
            document.getElementById('knowledge').textContent = this.stats.knowledge;
            document.getElementById('courage').textContent = this.stats.courage;
            document.getElementById('charm').textContent = this.stats.charm;
            document.getElementById('combat').textContent = this.stats.combat;
            document.getElementById('money').textContent = this.stats.money;
        }

        log(message, important = false) {
            const logDiv = document.getElementById('game-log');
            const entry = document.createElement('div');
            entry.className = 'log-entry' + (important ? ' important' : '');
            entry.textContent = message;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
    }

    // 启动游戏
    window.game = new Game();
    window.game.renderActions();

})();
    </script>
</body>
</html>
