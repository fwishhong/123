<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindLink - 认知空间</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="game-container">
        <!-- Loading Screen -->
        <div id="loading-screen" class="screen active">
            <div class="loading-content">
                <h1 class="pixel-title">MindLink</h1>
                <p class="subtitle">认知空间 / Cognitive Space</p>
                <div class="loading-bar">
                    <div class="loading-progress"></div>
                </div>
                <button id="start-game" class="pixel-button">开始游戏</button>
                <button id="load-game" class="pixel-button">继续游戏</button>
            </div>
        </div>

        <!-- Main Game Screen -->
        <div id="main-screen" class="screen">
            <!-- Top UI Bar -->
            <div class="top-bar">
                <div class="date-display">
                    <span class="day-label">Day</span>
                    <span id="current-day" class="day-number">1</span>
                    <span id="time-period" class="time-label">早晨</span>
                </div>
                <div class="attributes-display">
                    <div class="attribute" title="知识">
                        <span class="attr-icon">📚</span>
                        <span id="knowledge-value">1</span>
                    </div>
                    <div class="attribute" title="勇气">
                        <span class="attr-icon">⚔️</span>
                        <span id="courage-value">1</span>
                    </div>
                    <div class="attribute" title="魅力">
                        <span class="attr-icon">✨</span>
                        <span id="charm-value">1</span>
                    </div>
                    <div class="attribute" title="战斗力">
                        <span class="attr-icon">💪</span>
                        <span id="combat-value">1</span>
                    </div>
                </div>
                <button id="menu-button" class="icon-button">☰</button>
            </div>

            <!-- Main Content Area -->
            <div class="main-content">
                <!-- Activity Selection View -->
                <div id="activity-view" class="view active">
                    <h2 class="view-title">选择活动</h2>
                    <div class="activity-grid" id="activity-list">
                        <!-- Activities will be dynamically generated -->
                    </div>
                </div>

                <!-- Event View -->
                <div id="event-view" class="view">
                    <div class="event-display">
                        <div class="event-location" id="event-location">教室</div>
                        <div class="event-text" id="event-text"></div>
                        <div class="event-choices" id="event-choices">
                            <!-- Choices will be dynamically generated -->
                        </div>
                        <button id="event-continue" class="pixel-button">继续</button>
                    </div>
                </div>

                <!-- Character Relationship View -->
                <div id="relationship-view" class="view">
                    <h2 class="view-title">人际关系</h2>
                    <div class="character-grid" id="character-list">
                        <!-- Characters will be dynamically generated -->
                    </div>
                </div>

                <!-- Calendar View -->
                <div id="calendar-view" class="view">
                    <h2 class="view-title">日程表</h2>
                    <div class="calendar-grid" id="calendar-grid">
                        <!-- Calendar will be dynamically generated -->
                    </div>
                    <div class="deadline-list">
                        <h3>即将到来的截止日期</h3>
                        <ul id="deadline-list">
                            <!-- Deadlines will be dynamically generated -->
                        </ul>
                    </div>
                </div>

                <!-- Battle View -->
                <div id="battle-view" class="view">
                    <div class="battle-container">
                        <div class="enemy-area">
                            <div class="enemy-sprite" id="enemy-sprite"></div>
                            <div class="enemy-info">
                                <div class="enemy-name" id="enemy-name">未知敌人</div>
                                <div class="hp-bar">
                                    <div class="hp-fill" id="enemy-hp-fill" style="width: 100%"></div>
                                    <span class="hp-text" id="enemy-hp-text">100/100</span>
                                </div>
                            </div>
                        </div>
                        <div class="player-area">
                            <div class="player-info">
                                <div class="player-name">主角</div>
                                <div class="hp-bar">
                                    <div class="hp-fill player-hp" id="player-hp-fill" style="width: 100%"></div>
                                    <span class="hp-text" id="player-hp-text">100/100</span>
                                </div>
                            </div>
                        </div>
                        <div class="battle-log" id="battle-log">
                            <p>战斗开始！</p>
                        </div>
                        <div class="battle-actions">
                            <button class="action-button" data-action="attack">攻击</button>
                            <button class="action-button" data-action="skill">技能</button>
                            <button class="action-button" data-action="item">道具</button>
                            <button class="action-button" data-action="defend">防御</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Bottom Navigation -->
            <div class="bottom-nav">
                <button class="nav-button" data-view="activity-view">
                    <span class="nav-icon">📅</span>
                    <span class="nav-label">活动</span>
                </button>
                <button class="nav-button" data-view="relationship-view">
                    <span class="nav-icon">👥</span>
                    <span class="nav-label">关系</span>
                </button>
                <button class="nav-button" data-view="calendar-view">
                    <span class="nav-icon">📆</span>
                    <span class="nav-label">日程</span>
                </button>
            </div>
        </div>

        <!-- Menu Overlay -->
        <div id="menu-overlay" class="overlay">
            <div class="menu-panel">
                <h2>菜单</h2>
                <button class="menu-item" id="save-game-btn">保存游戏</button>
                <button class="menu-item" id="load-game-btn">读取存档</button>
                <button class="menu-item" id="settings-btn">设置</button>
                <button class="menu-item" id="return-title-btn">返回标题</button>
                <button class="menu-item" id="close-menu-btn">关闭</button>
            </div>
        </div>

        <!-- Notification Toast -->
        <div id="notification" class="notification"></div>
    </div>

    <!-- JavaScript Modules -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
