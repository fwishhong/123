<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindLink - 认知空间 (原型)</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- 游戏标题 -->
        <header class="game-header">
            <h1>MindLink - 认知空间</h1>
            <p class="subtitle">时间管理原型 (Day 1-15)</p>
        </header>

        <!-- 主游戏区域 -->
        <main class="game-container">
            <!-- 左侧：状态面板 -->
            <aside class="status-panel">
                <div class="status-section">
                    <h2>当前时间</h2>
                    <div class="time-display">
                        <div class="day-display">
                            <span class="label">Day</span>
                            <span id="current-day" class="value">1</span>
                        </div>
                        <div class="timeslot-display">
                            <span id="current-timeslot" class="timeslot morning">早晨</span>
                        </div>
                    </div>
                </div>

                <div class="status-section">
                    <h2>角色属性</h2>
                    <div class="attributes">
                        <div class="attribute">
                            <span class="attr-name">📚 知识</span>
                            <div class="progress-bar">
                                <div id="knowledge-bar" class="progress-fill" style="width: 0%"></div>
                            </div>
                            <span id="knowledge-value" class="attr-value">Lv 1 (0/100)</span>
                        </div>
                        <div class="attribute">
                            <span class="attr-name">⚔️ 勇气</span>
                            <div class="progress-bar">
                                <div id="courage-bar" class="progress-fill" style="width: 0%"></div>
                            </div>
                            <span id="courage-value" class="attr-value">Lv 1 (0/100)</span>
                        </div>
                        <div class="attribute">
                            <span class="attr-name">✨ 魅力</span>
                            <div class="progress-bar">
                                <div id="charm-bar" class="progress-fill" style="width: 0%"></div>
                            </div>
                            <span id="charm-value" class="attr-value">Lv 1 (0/100)</span>
                        </div>
                        <div class="attribute">
                            <span class="attr-name">⚡ 战斗</span>
                            <div class="progress-bar">
                                <div id="combat-bar" class="progress-fill" style="width: 0%"></div>
                            </div>
                            <span id="combat-value" class="attr-value">Lv 1 (0/100)</span>
                        </div>
                    </div>
                </div>

                <div class="status-section">
                    <h2>关系</h2>
                    <div class="relationships" id="relationships-container">
                        <!-- 动态生成 -->
                    </div>
                </div>

                <div class="status-section">
                    <h2>任务</h2>
                    <div class="missions" id="mission-container">
                        <!-- 动态生成 -->
                    </div>
                </div>
            </aside>

            <!-- 右侧：事件选择 -->
            <section class="event-panel">
                <div class="panel-header">
                    <h2>选择你的行动</h2>
                    <p class="hint">每个时间段只能选择一个活动</p>
                </div>

                <div id="events-container" class="events-grid">
                    <!-- 动态生成事件卡片 -->
                </div>

                <div class="action-buttons">
                    <button id="next-day-btn" class="btn btn-primary" style="display: none;">
                        进入下一天
                    </button>
                </div>
            </section>
        </main>

        <!-- 结果弹窗 -->
        <div id="result-modal" class="modal">
            <div class="modal-content">
                <h2 id="result-title">事件结果</h2>
                <p id="result-description"></p>
                <div id="result-rewards" class="rewards"></div>
                <button id="close-modal-btn" class="btn btn-primary">继续</button>
            </div>
        </div>

        <!-- 日终总结弹窗 -->
        <div id="day-end-modal" class="modal">
            <div class="modal-content day-summary">
                <h2>Day <span id="summary-day"></span> 结束</h2>
                <div class="summary-content">
                    <h3>今日完成：</h3>
                    <ul id="summary-activities"></ul>
                    <h3>属性变化：</h3>
                    <div id="summary-attributes"></div>
                </div>
                <button id="close-summary-btn" class="btn btn-primary">进入下一天</button>
            </div>
        </div>

        <!-- 游戏结束弹窗 -->
        <div id="game-over-modal" class="modal">
            <div class="modal-content">
                <h2>Day 15 完成！</h2>
                <div class="final-stats">
                    <h3>最终属性：</h3>
                    <div id="final-attributes"></div>
                    <h3>完成的活动：</h3>
                    <p id="final-activity-count"></p>
                </div>
                <button id="restart-btn" class="btn btn-primary">重新开始</button>
            </div>
        </div>

        <!-- 对话弹窗 -->
        <div id="dialogue-modal" class="modal">
            <div class="modal-content dialogue-box">
                <div id="dialogue-content">
                    <!-- 动态生成对话内容 -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
